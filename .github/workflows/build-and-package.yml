name: build-and-package

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libgdal-dev libgeos-dev \
            libsqlite3-dev libspatialite-dev \
            nlohmann-json3-dev

      - name: Build CLI
        run: |
          ./packaging/linux/build.sh

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: treetops-cli-linux
          path: build/bin/treetops-cli

  linux-gui:
    runs-on: ubuntu-latest
    needs: linux-cli
    steps:
      - uses: actions/checkout@v4

      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libgdal-dev libgeos-dev \
            libsqlite3-dev libspatialite-dev \
            nlohmann-json3-dev \
            libwebkit2gtk-4.1-dev curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Build Linux bundles
        run: |
          ./packaging/linux/build-gui.sh

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: treetops-linux-bundles
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm

  windows-installer:
    runs-on: windows-latest
    needs: linux-cli
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Install PowerShell dependencies
        shell: pwsh
        run: |
          choco install -y wixtoolset

      - name: Build Windows portable package and installer
        shell: pwsh
        run: |
          ./packaging/windows/build-installer.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: treetops-windows-artifacts
          path: |
            dist/**
